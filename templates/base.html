<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ismerisa Arts</title>
    <!--ESTA SIRVE PARA QUE SE REPLIQUE LO QUE ES NECESARIO EN LAS DEMAS PAGINAS-->

    <!-- Bootstrap CSS por CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- El CSS propio -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='estilos.css') }}"
    />
  </head>

  <body>
    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('inicio') }}">
          <a class="navbar-brand" href="{{ url_for('inicio') }}">
            Ismerisa Arts
          </a>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
          <div class="navbar-nav ms-auto">
            <a class="nav-link" href="{{ url_for('inicio') }}"> Inicio </a>

            <a class="nav-link" href="{{ url_for('clientes') }}"> Clientes </a>

            <a class="nav-link" href="{{ url_for('proveedores') }}">
              Proveedores
            </a>

            <a class="nav-link" href="{{ url_for('login') }}"> Login </a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Aquí se mostrará el contenido de cada página -->
    <main class="container my-4">{% block contenido %} {% endblock %}</main>

    <!-- Pie de página -->
    <footer class="text-white text-center py-3 mt-5">
      <p class="mb-0">2026 - Ismerisa Arts</p>
    </footer>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
