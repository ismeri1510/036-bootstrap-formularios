{% extends "base.html" %} {% block contenido %}

<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="card-title mb-4">Registro de Proveedores</h2>

        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Empresa:</label>
            <input type="text" name="empresa" class="form-control" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Contacto:</label>
            <input type="text" name="contacto" class="form-control" required />
          </div>

          <div class="mb-3">
            <label class="form-label">NIT:</label>
            <input type="text" name="nit" class="form-control" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Tipo de producto o servicio:</label>

            <select name="tipo" class="form-select" required>
              <option value="">Seleccione una opción</option>
              <option value="Resina">Resina</option>
              <option value="Pigmentos">Pigmentos</option>
              <option value="Moldes">Moldes</option>
              <option value="Herrajes">Herrajes</option>
              <option value="Empaques">Empaques</option>
              <option value="Otros">Otros</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Condición de pago:</label>

            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="pago"
                value="Contado"
                id="contado"
                required
              />

              <label class="form-check-label" for="contado"> Contado </label>
            </div>

            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="pago"
                value="Credito"
                id="credito"
              />

              <label class="form-check-label" for="credito"> Crédito </label>
            </div>
          </div>

          <div class="form-check mb-3">
            <input
              class="form-check-input"
              type="checkbox"
              name="activo"
              value="si"
              id="activo"
            />

            <label class="form-check-label" for="activo">
              Proveedor activo
            </label>
          </div>

          <button type="submit" class="btn btn-primary">
            Registrar proveedor
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
